<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PC-Man (1982) — WebAssembly</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0c0d10;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      overflow-x: hidden;
    }
    header {
      text-align: center;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 1.5rem;
      letter-spacing: 2px;
      color: #55ff55;
      text-shadow: 0 0 10px rgba(85, 255, 85, 0.4);
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #aaa;
    }
    #game-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      border: 2px solid #333;
      border-radius: 6px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
      max-width: 960px;
      width: 100%;
    }
    canvas#canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 3;
      max-height: 720px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      outline: none;
      background: #000;
    }
    #status-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #55ff55;
      font-size: 1.2rem;
      font-weight: bold;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 12px auto;
      border: 4px solid #333;
      border-top: 4px solid #55ff55;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #controls-hint {
      margin-top: 14px;
      background: #181a20;
      border: 1px solid #2a2d36;
      border-radius: 6px;
      padding: 10px 16px;
      max-width: 960px;
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
      gap: 12px;
      font-size: 0.85rem;
    }
    .key-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .key {
      background: #2b2e38;
      border: 1px solid #444957;
      color: #ffff55;
      padding: 2px 8px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.85rem;
      font-weight: bold;
      box-shadow: 0 2px 0 #15171d;
    }
    .footer {
      margin-top: 12px;
      font-size: 0.75rem;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <h1>PC-MAN (1982)</h1>
    <div class="subtitle">Faithful C++20 / Raylib Recreation in WebAssembly &amp; WebGL</div>
  </header>

  <div id="game-container">
    <div id="status-overlay">
      <div class="spinner" id="spinner"></div>
      <div id="status">Loading WebAssembly...</div>
    </div>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  </div>

  <div id="controls-hint">
    <div class="key-group">
      <span>Move:</span>
      <span class="key">&uarr;</span><span class="key">&darr;</span><span class="key">&larr;</span><span class="key">&rarr;</span>
      <span>or</span>
      <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span>
      <span>or</span>
      <span class="key">E</span><span class="key">S</span><span class="key">D</span><span class="key">X</span>
    </div>
    <div class="key-group">
      <span>Start / Select:</span>
      <span class="key">Space</span> / <span class="key">J</span>
    </div>
    <div class="key-group">
      <span>Mute:</span>
      <span class="key">Ctrl+S</span>
    </div>
    <div class="key-group">
      <span>Fullscreen:</span>
      <button style="background:#2b2e38;border:1px solid #444;color:#fff;padding:2px 8px;border-radius:4px;cursor:pointer;" onclick="Module.requestFullscreen(false, false)">⛶ Expand</button>
    </div>
  </div>

  <div class="footer">
    Original IBM PC DOS game by Greg Kuperberg (1982, Orion Software) &bull; Emscripten WebAssembly Port
  </div>

  <script type="text/javascript">
    const statusElement = document.getElementById('status');
    const overlayElement = document.getElementById('status-overlay');
    const canvasElement = document.getElementById('canvas');

    // Click canvas to resume AudioContext if browser policy blocks autoplay
    canvasElement.addEventListener('click', () => {
      canvasElement.focus();
    });

    var Module = {
      preRun: [],
      postRun: [
        function() {
          if (overlayElement) {
            overlayElement.style.opacity = '0';
            setTimeout(() => { overlayElement.style.display = 'none'; }, 300);
          }
          canvasElement.focus();
        }
      ],
      print: function(text) {
        console.log(text);
      },
      printErr: function(text) {
        console.error(text);
      },
      canvas: (function() {
        return canvasElement;
      })(),
      setStatus: function(text) {
        if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
        if (text === Module.setStatus.last.text) return;
        var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        var now = Date.now();
        if (m && now - Module.setStatus.last.time < 30) return; // if this is a progress update, skip if too fast
        Module.setStatus.last.time = now;
        Module.setStatus.last.text = text;
        if (text) {
          if (statusElement) statusElement.innerHTML = text;
        } else if (overlayElement) {
          overlayElement.style.display = 'none';
        }
      },
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
      }
    };

    Module.setStatus('Downloading WebAssembly binary...');
    window.onerror = function() {
      Module.setStatus('Exception thrown, see JavaScript console');
      if (overlayElement) overlayElement.style.color = '#ff5555';
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
